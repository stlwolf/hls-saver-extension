<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      margin: 0;
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
    }
    .status.on {
      background: #4CAF50;
    }
    .status.off {
      background: #f44336;
    }
    .stats {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .stats-row:last-child {
      margin-bottom: 0;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .btn-primary {
      background: #2196F3;
      color: white;
    }
    .btn-primary:hover {
      background: #1976D2;
    }
    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .btn-toggle {
      background: #4CAF50;
      color: white;
    }
    .btn-toggle.off {
      background: #f44336;
    }
    .btn-danger {
      background: #ff9800;
      color: white;
    }
    .btn-danger:hover {
      background: #f57c00;
    }
    .file-list {
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      background: #fafafa;
      border-radius: 4px;
      margin-top: 12px;
      padding: 8px;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      border-bottom: 1px solid #eee;
    }
    .file-item:last-child {
      border-bottom: none;
    }
    .file-name {
      color: #333;
      word-break: break-all;
    }
    .file-size {
      color: #666;
      white-space: nowrap;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <h1>
    <span class="status" id="status"></span>
    HLS Saver
  </h1>
  
  <div class="stats">
    <div class="stats-row">
      <span>Captured:</span>
      <span id="captured">0 files</span>
    </div>
    <div class="stats-row">
      <span>Total Size:</span>
      <span id="totalSize">0 B</span>
    </div>
  </div>
  
  <div class="buttons">
    <button id="toggleBtn" class="btn-toggle">Capturing: ON</button>
    <button id="downloadBtn" class="btn-primary" disabled>Download All</button>
    <button id="clearBtn" class="btn-danger">Clear</button>
  </div>
  
  <div class="file-list" id="fileList"></div>
  
  <script src="popup.js"></script>
</body>
</html>
