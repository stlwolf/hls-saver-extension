<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>HLS Saver</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
<h1>HLS Saver</h1>
<p id="status" role="status" aria-live="polite">確認中…</p>
<dl><dt>動画断片の保存完了</dt><dd id="captured">—</dd><dt>プレイリスト保存済み</dt><dd id="playlists">—</dd><dt>蓄積容量</dt><dd id="totalSize">—</dd><dt>保存待ち</dt><dd id="pending">—</dd><dt>保存失敗</dt><dd id="failed">—</dd></dl>
<div class="actions"><button id="toggleBtn" disabled>収録 ON / OFF</button><button id="downloadBtn" disabled>結合して書き出す</button><button id="clearBtn" class="secondary" disabled>蓄積をクリア</button></div>
<p id="error" class="error" role="alert"></p>
<p class="muted">このタブの再生データだけを蓄積します。リロード・ページ移動・タブ終了で自動削除されます。書き出したファイルは残ります。</p>
<script src="popup.js"></script></body>
</html>
